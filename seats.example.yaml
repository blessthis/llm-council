# seats.example.yaml — trimmed 3-seat example (see docs/seats-schema.md for the full schema).
# Copy to ~/.blessthis-llm-council/seats.yaml, replace every __REPLACE_ME__, chmod 600.
# DO NOT commit your real seats.yaml — it contains secrets.

version: 1

telemetry:
  enabled: true

seats:
  fable:
    models: [fable, opus]
    agent:
      bin: claude
      args:
        - "-p"
        - "{prompt}"
        - "--output-format"
        - "json"
        - "--dangerously-skip-permissions"
        - "--model"
        - "{model}"
        - "--add-dir"
        - "{workdir}"
      env:
        ANTHROPIC_API_KEY: __REPLACE_ME__
        ANTHROPIC_BASE_URL: https://api.anthropic.com

  glm:
    models: [glm-5.2]
    agent:
      bin: pi
      args:
        - "--mode"
        - "json"
        - "--no-extensions"
        - "--no-skills"
        - "--no-prompt-templates"
        - "--no-context-files"
        - "-p"
        - "{prompt}"
        - "--model"
        - "{model}"
      env: {}
      # add --tools <allowlist> to sandbox this seat
      # (cuts off MCP servers + extensions)

  gpt:
    models: [gpt-5.3]
    agent:
      bin: codex
      args:
        - "exec"
        - "--json"
        - "--skip-git-repo-check"
        - "-s"
        - "read-only"
        - "--color"
        - "never"
        - "-m"
        - "{model}"
        - "-C"
        - "{workdir}"
        - "{prompt}"
      env:
        OPENAI_BASE_URL: __REPLACE_ME__
        OPENAI_API_KEY: __REPLACE_ME__
